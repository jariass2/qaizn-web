<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 45 45" width="45" height="45">
  <!-- Fondo sólido: legible sobre pestañas claras y oscuras -->
  <rect width="45" height="45" rx="9" fill="#c4c0b6"/>

  <!-- Ciclo de mejora continua. A 16px los guiones del logotipo se funden en
       una mancha, así que aquí el anillo va continuo -->
  <circle cx="22.5" cy="22.5" r="15.2" fill="none" stroke="#c2521a" stroke-width="3.2"/>

  <!-- Flecha ascendente: cabeza ancha para que sobreviva al rasterizado -->
  <path d="M 22.5 30.5 L 22.5 17.5" fill="none" stroke="#14140f"
        stroke-width="4" stroke-linecap="round"/>
  <path d="M 15.6 23.6 L 22.5 15.5 L 29.4 23.6" fill="none" stroke="#14140f"
        stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
